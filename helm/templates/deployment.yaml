apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gtts.fullname" . }}
  labels:
    {{- include "gtts.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gtts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gtts.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gtts.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: config-volume
              mountPath: /opt/gtts/config.yaml
              subPath: config.yaml
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: fluentbit
          image: "{{ .Values.sidecar.fluentbit.repository }}:{{ .Values.sidecar.fluentbit.tag }}"
          imagePullPolicy: {{ .Values.sidecar.fluentbit.pullPolicy }}
          {{- if .Values.sidecar.fluentbit.service.port }}
          ports:
            # - name: {{ .Values.sidecar.fluentbit.service.name }}
            #   containerPort: {{ .Values.sidecar.fluentbit.service.port }}
            #   protocol: {{ .Values.sidecar.fluentbit.service.protocol }}
          {{- end }}
          env:
            {{- toYaml .Values.sidecar.fluentbit.env | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sidecar.fluentbit.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.sidecar.fluentbit.resources | nindent 12 }}
          {{- with .Values.sidecar.fluentbit.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "gtts.fullname" .) }}
          {{- else }}
          emptyDir: { }
          {{- end }}
        - name: config-volume
          configMap:
            name: {{ include "gtts.fullname" . }}-cm
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
